{% extends "base.html" %}

{% block title %}500 Internal Error | AquaGuard AI{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center;">
    <div class="glass-card" style="max-width: 600px; padding: 4rem 2rem;">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 5rem; color: var(--danger); margin-bottom: 1.5rem; opacity: 0.8;"></i>
        <h1 style="font-size: 4rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--danger);">500</h1>
        <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Internal Server Error</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Oops! It looks like our water filters got clogged. We are experiencing technical difficulties on our end. Please try again later.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1.1rem;"><i class="fa-solid fa-home"></i> Return Home</a>
    </div>
</div>
{% endblock %}
