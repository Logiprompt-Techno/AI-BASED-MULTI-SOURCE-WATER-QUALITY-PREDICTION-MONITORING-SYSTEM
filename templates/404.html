{% extends "base.html" %}

{% block title %}404 Not Found | AquaGuard AI{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center;">
    <div class="glass-card" style="max-width: 600px; padding: 4rem 2rem;">
        <i class="fa-solid fa-water" style="font-size: 5rem; color: var(--accent-primary); margin-bottom: 1.5rem; opacity: 0.8;"></i>
        <h1 style="font-size: 4rem; font-weight: 700; margin-bottom: 0.5rem; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</h1>
        <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Page Not Found</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">It looks like this drop of water evaporated. The page you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1.1rem;"><i class="fa-solid fa-home"></i> Return Home</a>
    </div>
</div>
{% endblock %}
