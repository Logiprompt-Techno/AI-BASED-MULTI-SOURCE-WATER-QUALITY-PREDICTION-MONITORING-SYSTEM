{% extends "base.html" %}

{% block title %}Inspector Login | AquaGuard AI{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="glass-card" style="width: 100%; max-width: 450px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2><i class="fa-solid fa-user-shield" style="color: var(--accent-primary);"></i> Inspector Portal</h2>
            <p style="color: var(--text-secondary);">Secure login for Water Quality Inspectors</p>
        </div>

        <form action="{{ url_for('inspector_login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="email">Email Address</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
                    <input type="email" id="email" name="email" class="form-control" style="padding-left: 2.5rem;" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
                    <input type="password" id="password" name="password" class="form-control" style="padding-left: 2.5rem;" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                <i class="fa-solid fa-right-to-bracket"></i> Login to Portal
            </button>
        </form>
    </div>
</div>
{% endblock %}
